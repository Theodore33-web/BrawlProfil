<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profil Brawl Stars</title>
  <link rel="icon" type="image/png" id="favicon" href="logobs.png">
  <link rel="apple-touch-icon" href="logobs.png">
  <style>
:root {
  --fond: #0b0d1a;
  --carte: #151a33;
  --carte2: #1e2548;
  --texte: #eef1ff;
  --discret: #8e98c9;
  --jaune: #ffc928;
  --bleu: #3aa0ff;
  --vert: #3ddc84;
  --rouge: #ff5a5f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: linear-gradient(160deg, #1d1040 0%, var(--fond) 55%, #08232f 100%) fixed;
  color: var(--texte);
  font-family: "Trebuchet MS", system-ui, sans-serif;
}
html, body { overflow-x: hidden; }
main { max-width: 1000px; margin: 0 auto; padding: 12px; min-width: 0; }
h2 { margin: 0; font-size: 1.3rem; }
.cache { display: none !important; }
.carte {
  background: var(--carte);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
  border: 1px solid rgba(255, 255, 255, .07);
}
.chargement, .erreur { text-align: center; color: var(--discret); }
.erreur { color: var(--rouge); }
.note { color: var(--discret); font-size: .8rem; }

/* ---------- Bannière ---------- */
.banniere {
  background: linear-gradient(135deg, #2a1566, #12285a 60%, #0b3a4a);
  border-radius: 16px; padding: 8px 8px 10px; margin-bottom: 12px;
  border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 6px 20px rgba(0, 0, 0, .35);
}
.banniere-titre {
  text-align: center; font-weight: bold; letter-spacing: .08em; text-transform: uppercase;
  color: var(--jaune); font-size: .9rem; padding: 2px 0 6px; text-shadow: 0 2px 4px rgba(0,0,0,.6);
}
.banniere-grille { display: grid; grid-template-columns: repeat(15, minmax(0, 1fr)); gap: 2px; }
.banniere-grille .cell { position: relative; width: 100%; padding-bottom: 100%; overflow: hidden; }
.banniere-grille .cell img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
.banniere-grille .cell.possede { cursor: pointer; }
.banniere-grille .cell.absent img { filter: grayscale(1); opacity: .3; }

/* ---------- Onglets ---------- */
.onglets { display: flex; gap: 8px; margin-bottom: 12px; }
.onglets button {
  flex: 1; background: var(--carte); color: var(--texte); border: 1px solid rgba(255,255,255,.08);
  padding: 10px; border-radius: 12px; font: inherit; font-weight: bold; cursor: pointer;
}
.onglets button.actif { background: var(--jaune); color: #222; border-color: var(--jaune); }

/* ---------- Profil ---------- */
.profil { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.avatar {
  width: 88px; height: 88px; border-radius: 50%;
  border: 4px solid var(--jaune); background: var(--carte2);
  object-fit: cover;
}
.profil h1 { margin: 0; font-size: 2rem; }
.tag { color: var(--discret); margin: 2px 0 8px; }
.pastille {
  display: inline-block; background: var(--carte2);
  padding: 4px 12px; border-radius: 99px; font-size: .9rem; margin: 0 6px 6px 0;
}
.niveau { color: var(--jaune); }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 6px; margin-bottom: 12px; }
.stat { background: var(--carte); border-radius: 10px; padding: 6px 8px; text-align: center; border: 1px solid rgba(255, 255, 255, .06); }
.stat b { display: block; font-size: 1.05rem; color: var(--jaune); white-space: nowrap; }
.stat span { color: var(--discret); font-size: .68rem; line-height: 1.1; display: block; }

/* ---------- Liste ---------- */
.entete-brawlers { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 12px; }
#compteur { color: var(--jaune); }
.barre { flex: 1; min-width: 140px; height: 14px; background: var(--carte2); border-radius: 99px; overflow: hidden; }
#barre-remplie { height: 100%; width: 0; background: linear-gradient(90deg, var(--bleu), var(--vert)); transition: width .6s; }
.filtres { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.filtres button {
  background: var(--carte2); color: var(--texte); border: 0; cursor: pointer;
  padding: 8px 14px; border-radius: 10px; font: inherit;
}
.filtres button.actif { background: var(--jaune); color: #222; font-weight: bold; }

.groupe { margin-bottom: 22px; }
.bandeau-rarete {
  display: flex; justify-content: space-between; align-items: center;
  padding: 6px 14px; border-radius: 10px; margin-bottom: 10px;
  font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5);
  background: var(--couleur);
}
.grille { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.brawler {
  background: var(--carte2); border-radius: 16px; padding: 10px; text-align: center;
  position: relative; cursor: pointer; border-bottom: 4px solid var(--couleur);
  transition: transform .15s;
}
.brawler:hover { transform: translateY(-3px); }
.rond {
  width: 100%; max-width: 110px; aspect-ratio: 1 / 1; margin: 0 auto; border-radius: 12px;
  background: var(--couleur);
  background: linear-gradient(160deg, var(--couleur), color-mix(in srgb, var(--couleur) 25%, var(--carte)));
  border: 2px solid var(--couleur);
  border: 2px solid color-mix(in srgb, var(--couleur) 70%, #fff 20%);
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.rond img { width: 100%; height: 100%; object-fit: contain; }
.brawler .nom { font-weight: bold; font-size: .95rem; margin: 6px 0 2px; }
.brawler .info { font-size: .8rem; color: var(--discret); }
.brawler .puissance {
  position: absolute; top: 6px; left: 6px; background: var(--bleu);
  border-radius: 8px; padding: 1px 7px; font-size: .72rem; font-weight: bold;
}
.brawler .troph { color: var(--jaune); font-weight: bold; }
.brawler.manquant { cursor: default; opacity: .85; }
.brawler.manquant:hover { transform: none; }
.brawler.manquant .rond { filter: grayscale(1) brightness(.5); }
.brawler.manquant .nom { color: var(--discret); }
.brawler.manquant .etat { color: var(--rouge); font-size: .8rem; }
.badges { display: flex; justify-content: center; gap: 5px; margin-top: 6px; font-size: .95rem; flex-wrap: wrap; }
.badges .off { filter: grayscale(1); opacity: .25; }
.sep { opacity: .3; }
.equip {
  display: flex; justify-content: center; gap: 8px; margin-top: 6px;
  font-size: .8rem; background: rgba(0, 0, 0, .22); border-radius: 8px; padding: 3px 6px;
}

/* ---------- Catalogue ---------- */
.grille-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.tuile-cat {
  background: var(--carte2); border-radius: 14px; overflow: hidden; cursor: pointer;
  border-bottom: 4px solid var(--couleur); text-align: center; transition: transform .15s;
}
.tuile-cat:hover { transform: translateY(-3px); }
.tuile-cat .vitrine {
  height: 150px; display: flex; align-items: center; justify-content: center;
  background: var(--carte2);
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--couleur) 55%, var(--carte)), var(--carte2));
}
.tuile-cat .vitrine img { max-width: 90%; max-height: 90%; object-fit: contain; }
.tuile-cat.absent .vitrine img { filter: grayscale(1) brightness(.6); }
.tuile-cat .nom { font-weight: bold; padding: 6px 4px 0; font-size: .95rem; }
.tuile-cat .sous { color: var(--discret); font-size: .75rem; padding: 2px 4px 8px; }

/* ---------- Détail ---------- */
.retour {
  background: var(--carte2); color: var(--texte); border: 0; cursor: pointer;
  width: 46px; height: 46px; border-radius: 50%; font-size: 1.5rem; line-height: 1;
}
.detail { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 760px) { .detail { grid-template-columns: 1fr; } }
.col-gauche h1 { margin: 14px 0 10px; font-size: 2rem; }
.bandeau-grand {
  padding: 8px 16px; border-radius: 10px; background: var(--couleur);
  font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); display: inline-block;
}
.col-gauche p { color: var(--discret); font-size: .9rem; }
.modele {
  height: 340px; border-radius: 18px; display: flex; align-items: center; justify-content: center;
  background: var(--carte2);
  background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--couleur) 45%, var(--carte)), var(--carte2));
}
.modele img { max-height: 90%; max-width: 90%; object-fit: contain; }
.skins h3, .col-droite h3 { margin: 16px 0 8px; font-size: 1.05rem; }
.liste-skins { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.skin-puce {
  display: flex; align-items: center; gap: 6px; background: var(--carte2); border-radius: 10px;
  padding: 6px 10px; font-size: .85rem; opacity: .45; border: 1px solid transparent; cursor: pointer;
}
.skin-puce.poss { opacity: 1; border-color: var(--jaune); }
.skin-puce .x { color: var(--rouge); font-weight: bold; padding-left: 4px; }
.ajout-skin { display: flex; gap: 6px; }
.ajout-skin input {
  flex: 1; min-width: 0; background: var(--carte2); color: var(--texte); border: 0;
  padding: 8px 10px; border-radius: 10px; font: inherit;
}
.ajout-skin button {
  background: var(--jaune); color: #222; border: 0; border-radius: 10px; padding: 8px 12px;
  font: inherit; font-weight: bold; cursor: pointer;
}
.ligne { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--carte2); font-size: .92rem; }
.ligne b { color: var(--jaune); }
.vide { color: var(--discret); font-style: italic; font-size: .9rem; }
.objets { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 8px; }
.objet { text-align: center; font-size: .68rem; line-height: 1.1; opacity: .3; filter: grayscale(.9); }
.objet.poss { opacity: 1; filter: none; }
.objet img { width: 52px; height: 52px; object-fit: contain; display: block; margin: 0 auto 3px; }
.objet .pas-img { font-size: 1.8rem; height: 52px; display: flex; align-items: center; justify-content: center; }
details { margin-top: 14px; font-size: .75rem; color: var(--discret); }
pre { white-space: pre-wrap; word-break: break-all; }

/* ---------- Page de chargement ---------- */
#chargement {
  position: fixed; inset: 0; z-index: 9999;
  background: linear-gradient(160deg, #1d1040 0%, #0b0d1a 55%, #08232f 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
  transition: opacity .6s;
}
#chargement.fini { opacity: 0; pointer-events: none; }
#chg-logo img { width: min(72vw, 420px); height: auto; display: block; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
.chg-barre { width: min(60vw, 300px); height: 10px; border-radius: 99px; background: rgba(255, 255, 255, .12); overflow: hidden; }
.chg-barre i { display: block; height: 100%; width: 40%; border-radius: 99px; background: linear-gradient(90deg, var(--bleu), var(--vert)); animation: glisse 1.1s ease-in-out infinite; }
.chg-barre.stop i { animation: none; background: var(--rouge); width: 100%; }
@keyframes glisse { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
#chg-texte { color: var(--discret); font-size: .95rem; text-align: center; padding: 0 16px; }
#chg-retry {
  background: var(--jaune); color: #222; border: 0; border-radius: 12px; padding: 10px 20px;
  font: inherit; font-weight: bold; cursor: pointer;
}
#btn-son {
  position: fixed; right: 12px; bottom: 12px; z-index: 10000; width: 42px; height: 42px; border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, .2); background: rgba(21, 26, 51, .85); color: var(--texte);
  font-size: 1.2rem; cursor: pointer;
}

/* ---------- Images perso, rareté, buffies ---------- */
.rar { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; z-index: 2; }
.rar img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ligne.sans-barre { border-bottom: 0; padding-bottom: 0; }
.desc { border-bottom: 1px solid var(--carte2); padding-bottom: 10px; margin: 4px 0 0; }
.detail .desc { border-bottom-color: rgba(255, 255, 255, .22); }
.rond-wrap { position: relative; width: 100%; max-width: 110px; margin: 0 auto; }
.rond-wrap .rond { max-width: none; margin: 0; }
.prest { position: absolute; right: -4px; bottom: -4px; width: 38%; max-width: 40px; z-index: 2; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .6)); }
.prest img { width: 100%; height: auto; display: block; }
.bandeau-grand { display: inline-flex; align-items: center; gap: 8px; }
.bandeau-grand img { height: 1.4em; width: auto; }
.onglets button img { height: 30px; width: auto; display: block; margin: 0 auto; }
.buf-g { filter: drop-shadow(0 0 2px #3ddc84) drop-shadow(0 0 2px #3ddc84); }
.buf-s { filter: drop-shadow(0 0 2px #ffc928) drop-shadow(0 0 2px #ffc928); }
.buf-h { filter: drop-shadow(0 0 2px #c06bff) drop-shadow(0 0 2px #c06bff); }
.badges .ico { height: 1.3em; }


/* cartes compactes : 3 brawlers par ligne */
.brawler { padding: 8px 4px; border-radius: 12px; min-width: 0; }
.brawler .nom { font-size: .8rem; margin: 4px 0 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brawler .info { font-size: .68rem; }
.brawler .troph { font-size: .78rem; }
.brawler .puissance { font-size: .6rem; padding: 1px 5px; top: 4px; left: 4px; }
.brawler .equip { gap: 4px; font-size: .68rem; padding: 2px 3px; flex-wrap: wrap; }
.brawler .badges { gap: 2px; font-size: .8rem; }
.brawler .role { font-size: .62rem; color: var(--discret); line-height: 1.1; margin-bottom: 2px; }
.ico { height: 1.15em; width: auto; vertical-align: middle; }
.prestige-img { display: block; margin-top: 12px; border-radius: 12px; }
.ligne .gauche { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ligne .mini { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
.ligne .mini-e, .ligne .pas-img { font-size: 1.3rem; width: 28px; height: 28px; text-align: center; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.ligne.non .gauche { opacity: .45; }
.ligne.non b { color: var(--discret); }
.desc { color: var(--discret); font-size: .85rem; line-height: 1.35; margin: 8px 0; }

/* vue détail : la couleur de la rareté sert de fond */
.detail {
  background: var(--couleur);
  background: linear-gradient(160deg, color-mix(in srgb, var(--couleur) 78%, #000), color-mix(in srgb, var(--couleur) 32%, #0b0d1a));
}
.detail .bandeau-grand { background: rgba(0, 0, 0, .35); border: 1px solid rgba(255, 255, 255, .3); }
.detail .ligne { border-bottom-color: rgba(255, 255, 255, .22); }
.detail .ligne b { color: #fff; }
.detail .ligne.non b { color: rgba(255, 255, 255, .6); }
.detail .desc, .detail .vide, .detail .col-gauche p, .detail details { color: rgba(255, 255, 255, .88); }
.detail .modele { background: rgba(0, 0, 0, .22); }
.detail .retour { background: rgba(0, 0, 0, .35); }
  </style>
</head>
<body>
  <!-- Page de chargement -->
  <div id="chargement">
    <div id="chg-logo"></div>
    <div class="chg-barre" id="chg-barre"><i></i></div>
    <div id="chg-texte">Chargement…</div>
    <button id="chg-retry" class="cache" onclick="location.reload()">Réessayer</button>
  </div>
  <button id="btn-son" class="cache" title="Son">🔊</button>
  <main>
    <div id="accueil">
      <!-- 1. Profil -->
      <section id="profil" class="carte profil">
        <p class="chargement">Chargement du profil…</p>
      </section>

      <!-- 2. Stats -->
      <section id="stats" class="stats"></section>

      <!-- 3. Bannière (15 emojis par ligne) -->
      <section class="banniere">
        <div class="banniere-titre" id="banniere-titre">Bannière Emoji Brawlers</div>
        <div class="banniere-grille" id="banniere"></div>
      </section>

      <!-- 4. Brawlers -->
      <nav class="onglets" id="onglets">
        <button data-onglet="liste" class="actif">🎮 Mes brawlers</button>
        <button data-onglet="catalogue" id="onglet-catalogue" title="Catalogue" aria-label="Catalogue"></button>
      </nav>

      <div id="vue-liste">
        <section class="carte">
          <div class="entete-brawlers">
            <h2>Brawlers <span id="compteur"></span></h2>
            <div class="barre"><div id="barre-remplie"></div></div>
          </div>
          <p class="note cache" id="info-rarete"></p>
          <div id="groupes"></div>
        </section>
      </div>

      <div id="vue-catalogue" class="cache">
        <section class="carte">
          <h2>Catalogue <span id="compteur-cat" style="color:var(--jaune)"></span></h2>
          <p class="note">Tous les brawlers du jeu avec leur modèle. Touche un brawler pour voir ses gadgets, pouvoirs stellaires, équipements.</p>
          <div id="catalogue"></div>
        </section>
      </div>
    </div>

    <!-- Détail d'un brawler -->
    <div id="vue-detail" class="cache">
      <section class="carte detail" id="detail"></section>
    </div>
  </main>

  <script>
const URL_GOOGLE = "https://script.google.com/macros/s/AKfycbzo32S-q5NS_qMPuH9daIQmMiC6APMZfnvUcq7PhEfoh0gNgup3iyqKYtNfEu5Dn6IVCw/exec";
const URLS_BRAWLIFY = ["https://api.brawlify.com/v1/brawlers", "https://api.brawlapi.com/v1/brawlers"];
const CDN = "https://cdn.brawlify.com/";

// Emojis provisoires (utilisés quand une image n'existe pas, ex. hypercharge)
const ICONES = {
  prestige: "🎖️",
  hypercharge: "🔥",
  buffieGadget: "🟩",
  buffieStarPower: "🟨",
  buffieHyperCharge: "🟪",
  starPower: "⭐",
  gadget: "🔧",
  gear: "⚙️",
};

// Raretés : ordre d'affichage, nom français, couleur
const RARETES = [
  { cle: "depart", nom: "Départ", couleur: "#9aa7b5" },
  { cle: "rare", nom: "Rare", couleur: "#3dbb4a" },
  { cle: "superrare", nom: "Super rare", couleur: "#2f8cff" },
  { cle: "epique", nom: "Épique", couleur: "#a64bf4" },
  { cle: "mythique", nom: "Mythique", couleur: "#ee3a3a" },
  { cle: "legendaire", nom: "Légendaire", couleur: "#ffc928" },
  { cle: "ultra", nom: "Ultra légendaire", couleur: "#ff5fd2" },
];
const INCONNUE = { cle: "inconnue", nom: "Rareté inconnue", couleur: "#6b7280" };
const RARETE_PAR_ID = { 1: "depart", 2: "rare", 3: "superrare", 4: "epique", 5: "mythique", 6: "legendaire", 7: "ultra" };

// Rôles Brawlify -> français
const ROLES = {
  "damage dealer": "Dégâts", "tank": "Tank", "support": "Soigneur / soutien",
  "controller": "Contrôleur", "assassin": "Assassin", "artillery": "Lanceur", "marksman": "Tireur d'élite",
};
const roleFr = nom => ROLES[String(nom).toLowerCase()] || nom;
const nomDe = x => (x && typeof x === "object") ? (x.name || "") : (typeof x === "string" ? x : "");
function hexOk(c) {
  c = String(c || "").trim();
  if (/^[0-9a-f]{6}$/i.test(c)) c = "#" + c;
  return /^#[0-9a-f]{3,8}$/i.test(c) ? c : "";
}

const fmt = n => Number(n || 0).toLocaleString("fr-FR");
const esc = t => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// Images Brawlify
const imgBrawler = id => CDN + "brawlers/borderless/" + id + ".png";
const imgEmoji = id => CDN + "brawlers/emoji/" + id + ".png";
const imgModele = id => CDN + "brawlers/model/" + id + ".png";
const imgIcone = id => CDN + "profile-icons/regular/" + id + ".png";
const imgGadget = id => CDN + "gadgets/borderless/" + id + ".png";
const imgGadgetBord = id => CDN + "gadgets/regular/" + id + ".png";
const imgStar = id => CDN + "star-powers/borderless/" + id + ".png";
const imgStarBord = id => CDN + "star-powers/regular/" + id + ".png";
const imgGear = id => CDN + "gears/regular/" + id + ".png";
const imgPrestige = (id, n) => CDN + "prestiges/brawlers/" + id + "/" + n + ".png";

/* ---------- Images perso (dépôt GitHub) avec chaîne de secours ---------- */
const DOSSIER = "Brawl%20Stars%20Image/";
const DOSSIER_RAW = "https://raw.githubusercontent.com/Theodore33-web/BrawlProfil/main/Brawl%20Stars%20Image/";
const imgPerso = nom => DOSSIER + encodeURIComponent(nom);
const imgPersoRaw = nom => DOSSIER_RAW + encodeURIComponent(nom);
const SYMBOLE = imgPerso("BS_Symbol.png");
const SYMBOLE_RAW = imgPersoRaw("BS_Symbol.png");

// onerror : image suivante de data-c ; en dernier recours le symbole Brawl Stars
function chaine(el) {
  let l = [];
  try { l = JSON.parse(el.dataset.c || "[]"); } catch (e) {}

/* ---------- Rareté ---------- */
function trouverRarete(nomAnglais, id) {
  const n = String(nomAnglais || "").toLowerCase();
  if (!n) {
    const cle = RARETE_PAR_ID[id];
    return cle ? RARETES.find(r => r.cle === cle) : INCONNUE;
  }
  let cle = "depart";
  if (n.includes("ultra")) cle = "ultra";
  else if (n.includes("legend")) cle = "legendaire";
  else if (n.includes("mythic")) cle = "mythique";
  else if (n.includes("epic")) cle = "epique";
  else if (n.includes("super")) cle = "superrare";
  else if (n.includes("rare")) cle = "rare";
  return RARETES.find(r => r.cle === cle);
}

async function chargerBrawlify() {
  let derniere = "";
  for (const url of URLS_BRAWLIFY) {
    try {
      const r = await fetch(url);
      if (!r.ok) throw new Error("HTTP " + r.status);
      const d = await r.json();
      const liste = d.list || d.items || (Array.isArray(d) ? d : []);
      if (!liste.length) throw new Error("réponse vide");
      const map = {};
      liste.forEach(b => {
        map[b.id] = {
          rarity: b.rarity, class: b.class, description: b.description,
          starPowers: b.starPowers, gadgets: b.gadgets,
        };
      });
      try { localStorage.setItem("brawlifyCache", JSON.stringify(map)); } catch (e) {}
      return { map, source: "direct" };
    } catch (e) {
      derniere = e.message;
    }
  }
  try {
    const c = JSON.parse(localStorage.getItem("brawlifyCache") || "null");
    if (c) return { map: c, source: "cache", erreur: derniere };
  } catch (x) {}
  return { map: {}, source: "aucune", erreur: derniere };
}

async function charger() {
  const debut = Date.now();
  try {
    etape("Connexion à Brawl Stars…");
    const pProfil = fetch(URL_GOOGLE).then(r => { etape("Profil récupéré…"); return r.json(); });
    const pExtra = chargerBrawlify().then(x => { etape("Raretés et rôles récupérés…"); return x; });
    const [d, extra] = await Promise.all([pProfil, pExtra]);
    if (d.erreur) throw new Error(d.erreur);
    afficherProfil(d.player);
    fusionner(d.player, d.brawlers.items || [], extra.map);
    afficherStats(d.player);
    afficherGroupes();
    afficherBanniere();
    afficherCatalogue();
    infoRarete(extra);
    etape("C'est prêt !");
    const reste = 900 - (Date.now() - debut);
    if (reste > 0) await new Promise(ok => setTimeout(ok, reste));
    finChargement();
  } catch (e) {
    document.getElementById("profil").innerHTML = '<p class="erreur">' + esc(e.message) + "</p>";
    erreurChargement("Impossible de charger les données : " + e.message);
  }
}

function infoRarete(extra) {
  const el = document.getElementById("info-rarete");
  const inconnus = tous.filter(b => b.rarete.cle === "inconnue").length;
  let msg = "";
  if (extra.source === "cache") msg = "Brawlify injoignable (" + extra.erreur + ") : rareté lue depuis la dernière sauvegarde.";
  else if (extra.source === "aucune") msg = "Rareté indisponible : Brawlify injoignable (" + extra.erreur + "). Les brawlers sont classés « Rareté inconnue ».";
  else if (inconnus) msg = inconnus + " brawler(s) absent(s) de Brawlify : rareté inconnue.";
  el.textContent = msg;
  el.classList.toggle("cache", !msg);
}

/* ---------- Lecture des données équipements ---------- */
function aHypercharge(b) {
  const h = b.hyperCharges || b.hypercharges || b.hyperCharge;
  return Array.isArray(h) ? h.length > 0 : !!h;
}
function lireBuffies(b) {
  const r = { gadget: false, starPower: false, hyperCharge: false };
  const x = b.buffies || b.buffs;
  if (!x) return r;
  if (Array.isArray(x)) {
    x.forEach(i => {
      const t = String(i && (i.type || i.name) || i).toLowerCase();
      if (t.includes("gadget")) r.gadget = true;
      else if (t.includes("star")) r.starPower = true;
      else if (t.includes("hyper")) r.hyperCharge = true;
    });
  } else {
    r.gadget = !!(x.gadget || x.gadgets);
    r.starPower = !!(x.starPower || x.starPowers);
    r.hyperCharge = !!(x.hyperCharge || x.hyperCharges || x.hypercharge);
  }
  return r;
}

const numOuNull = v => (v === null || v === undefined || isNaN(Number(v))) ? null : Number(v);

function fusionner(joueur, jeu, extra) {
  const possedes = {};
  (joueur.brawlers || []).forEach(b => { possedes[b.id] = b; });
  const choisir = (a, b) => (a && a.length ? a : (b || []));
  tous = jeu.map(b => {
    const p = possedes[b.id];
    const e = extra[b.id] || {};
    const cat = {
      gadgets: choisir(b.gadgets, e.gadgets),
      starPowers: choisir(b.starPowers, e.starPowers),
      gears: b.gears || [],
      hyper: b.hyperCharges || b.hypercharges || [],
    };
    return {
      id: b.id,
      nom: b.name,
      rarete: trouverRarete(nomDe(e.rarity), e.rarity && e.rarity.id),
      classe: nomDe(e.class) && nomDe(e.class) !== "Unknown" ? roleFr(nomDe(e.class)) : "",
      couleurHex: e.rarity && e.rarity.color ? hexOk(e.rarity.color) : "",
      description: e.description || "",
      possede: !!p,
      puissance: p ? p.power : 0,
      trophees: p ? p.trophies : 0,
      record: p ? p.highestTrophies : 0,
      rang: p ? p.rank : 0,
      gadgets: p ? (p.gadgets || []) : [],
      starPowers: p ? (p.starPowers || []) : [],
      gears: p ? (p.gears || []) : [],
      hyper: p ? aHypercharge(p) : false,
      buffies: p ? lireBuffies(p) : { gadget: false, starPower: false, hyperCharge: false },
      brut: p || null,
      tier: p ? palierPrestige(Number(p.trophies) || 0) : null,
      serie: p ? numOuNull(p.currentWinStreak != null ? p.currentWinStreak : p.current_win_streak) : null,
      serieMax: p ? numOuNull(p.maxWinStreak != null ? p.maxWinStreak : p.max_win_streak) : null,
      skinNom: p && p.skin ? (nomDe(p.skin) || "") : "",
      catalogue: cat,
      max: { starPowers: cat.starPowers.length, gadgets: cat.gadgets.length, gears: cat.gears.length },
    };
  });
  // couleur de chaque rareté fournie par Brawlify (hex)
  tous.forEach(b => { if (b.couleurHex && b.rarete.cle !== "inconnue") b.rarete.couleur = b.couleurHex; });
  totaux = {
    starPowers: tous.reduce((t, b) => t + b.max.starPowers, 0),
    gadgets: tous.reduce((t, b) => t + b.max.gadgets, 0),
    gears: tous.reduce((t, b) => t + b.max.gears, 0),
  };
  const n = tous.filter(b => b.possede).length;
  document.getElementById("compteur").textContent = n + " / " + tous.length;
  document.getElementById("compteur-cat").textContent = n + " / " + tous.length;
  document.getElementById("barre-remplie").style.width = (tous.length ? (n / tous.length) * 100 : 0) + "%";
}

function afficherStats(j) {
  const mien = tous.filter(b => b.possede);
  const nbHyper = mien.filter(b => b.hyper).length;
  const nbBg = mien.filter(b => b.buffies.gadget).length;
  const nbBs = mien.filter(b => b.buffies.starPower).length;
  const nbBh = mien.filter(b => b.buffies.hyperCharge).length;
  const somme = cle => mien.reduce((t, b) => t + b[cle].length, 0);
  const sur = total => total ? " / " + total : "";
  const meilleur = mien.slice().sort((a, b) => b.record - a.record)[0];
  const totalRecords = mien.reduce((s, b) => s + b.record, 0);
  const serie = mien.filter(b => b.serieMax != null && b.serieMax > 0).sort((a, b) => b.serieMax - a.serieMax)[0];
  const stats = [
    ["🏆", fmt(j.trophies), "Trophées"],
    ["🥇", fmt(j.highestTrophies), "Record"],
    ["📈", fmt(totalRecords), "Total des records"],
  ];
  if (meilleur) stats.push(["👑", fmt(meilleur.record), "Record · " + esc(meilleur.nom)]);
  if (serie) stats.push(["⚡", serie.serieMax, "Série max · " + esc(serie.nom)]);
  stats.push(
    ["⚔️", fmt(j["3vs3Victories"]), "Victoires 3c3"],
    ["🎯", fmt(j.soloVictories), "Victoires solo"],
    ["👥", fmt(j.duoVictories), "Victoires duo"],
    ["✨", fmt(j.expPoints), "Expérience"],
    [ICONES.gadget, somme("gadgets") + sur(totaux.gadgets), "Gadgets"],
    [ICONES.starPower, somme("starPowers") + sur(totaux.starPowers), "Pouvoirs stellaires"],
    [ICONES.gear, somme("gears") + sur(totaux.gears), "Équipements"],
    [ICONES.hypercharge, nbHyper + " / " + mien.length, "Hypercharges"],
    [ICONES.buffieGadget, nbBg + " / " + mien.length, "Buffies gadget"],
    [ICONES.buffieStarPower, nbBs + " / " + mien.length, "Buffies pouvoir stellaire"],
    [ICONES.buffieHyperCharge, nbBh + " / " + mien.length, "Buffies hypercharge"]
  );
  document.getElementById("stats").innerHTML = stats
    .map(s => '<div class="stat"><b>' + s[0] + " " + s[1] + "</b><span>" + s[2] + "</span></div>")
    .join("");
}

        : '<div class="ligne"><span>Statut</span><b>Non possédé</b></div>') +
      "<h3>Hypercharge</h3>" +
      ligneIcone(persoHtml("Empty-Hypercharge.webp", "mini", ""), "Hypercharge" + (hyperNom ? " (" + hyperNom + ")" : ""), b.hyper) +
      "<h3>Buffies</h3>" +
      ligneIcone(persoHtml("Icon-Buffie.webp", "mini buf-g", ""), "Buffie gadget", buf.gadget) +
      ligneIcone(persoHtml("Icon-Buffie.webp", "mini buf-s", ""), "Buffie pouvoir stellaire", buf.starPower) +
      ligneIcone(persoHtml("Icon-Buffie.webp", "mini buf-h", ""), "Buffie hypercharge", buf.hyperCharge) +
      "<h3>" + ICONES.gadget + " Gadgets " + b.gadgets.length + (b.max.gadgets ? " / " + b.max.gadgets : "") + "</h3>" +
        objetsHtml(c.gadgets, b.gadgets, imgGadget, imgGadgetBord, BASE_OBJETS.gadget, "Aucun gadget") +
      "<h3>" + ICONES.starPower + " Pouvoirs stellaires " + b.starPowers.length + (b.max.starPowers ? " / " + b.max.starPowers : "") + "</h3>" +
        objetsHtml(c.starPowers, b.starPowers, imgStar, imgStarBord, BASE_OBJETS.starPower, "Aucun pouvoir stellaire") +
      "<h3>" + ICONES.gear + " Équipements " + b.gears.length + (b.max.gears ? " / " + b.max.gears : "") + "</h3>" +
        objetsHtml(c.gears, b.gears, imgGear, null, BASE_OBJETS.gear, "Aucun équipement") +
    "</div>";

  montrer("detail");
  window.scrollTo(0, 0);
}

/* ---------- Navigation ---------- */
function montrer(vue) {
  document.getElementById("accueil").classList.toggle("cache", vue === "detail");
  document.getElementById("vue-detail").classList.toggle("cache", vue !== "detail");
  if (vue !== "detail") {
    ongletCourant = vue;
    document.getElementById("vue-liste").classList.toggle("cache", vue !== "liste");
    document.getElementById("vue-catalogue").classList.toggle("cache", vue !== "catalogue");
  }
  document.querySelectorAll("#onglets button").forEach(x =>
    x.classList.toggle("actif", x.dataset.onglet === (vue === "detail" ? ongletPrecedent : vue)));
}

/* ---------- Événements ---------- */
document.getElementById("onglets").addEventListener("click", e => {
  const bt = e.target.closest("button[data-onglet]");
  if (!bt) return;
  const o = bt.dataset.onglet;
  if (o === "catalogue") afficherCatalogue();
  montrer(o);
});
document.getElementById("groupes").addEventListener("click", e => {
  const c = e.target.closest(".brawler[data-id]");
  if (c) ouvrirDetail(c.dataset.id);
});
document.getElementById("catalogue").addEventListener("click", e => {
  const c = e.target.closest(".tuile-cat[data-id]");
  if (c) ouvrirDetail(c.dataset.id);
});
document.getElementById("banniere").addEventListener("click", e => {
  const i = e.target.closest(".cell.possede");
  if (i) ouvrirDetail(i.dataset.id);
});
document.getElementById("detail").addEventListener("click", e => {
  if (e.target.id === "btn-retour") montrer(ongletPrecedent);
});

charger();
  </script>
</body>
</html>
